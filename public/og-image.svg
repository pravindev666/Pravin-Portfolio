<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Glowing Background Orbs -->
  <circle cx="600" cy="180" r="300" fill="#F59E0B" opacity="0.15" filter="url(#glow)"/>
  <circle cx="1000" cy="480" r="250" fill="#EF4444" opacity="0.12" filter="url(#glow)"/>
  <circle cx="200" cy="480" r="250" fill="#6366F1" opacity="0.12" filter="url(#glow)"/>

  <!-- Border Frame -->
  <rect x="20" y="20" width="1160" height="590" rx="24" fill="none" stroke="#F59E0B" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Main Name Title -->
  <text x="600" y="180" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="900" font-size="64" fill="#FFFFFF" letter-spacing="-1">Pravin A Mathew</text>
  
  <!-- Subtitle with Gradient -->
  <text x="600" y="245" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="700" font-size="28" fill="url(#textGrad)" letter-spacing="0.5">Cloud &amp; AI Infrastructure Engineer | Solutions Architect</text>

  <!-- Divider Line -->
  <line x1="400" y1="285" x2="800" y2="285" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="8 4"/>

  <!-- Tech Cards Grid (5 Badges) -->

  <!-- Card 1: AWS -->
  <g transform="translate(100, 340)">
    <rect width="170" height="180" rx="20" fill="#1E293B" fill-opacity="0.8" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="85" y="85" text-anchor="middle" font-family="Inter, sans-serif" font-weight="900" font-size="32" fill="#FF9900">AWS</text>
    <text x="85" y="130" text-anchor="middle" font-family="Inter, sans-serif" font-weight="600" font-size="16" fill="#94A3B8">Cloud Platform</text>
  </g>

  <!-- Card 2: Kubernetes -->
  <g transform="translate(300, 340)">
    <rect width="170" height="180" rx="20" fill="#1E293B" fill-opacity="0.8" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="85" y="85" text-anchor="middle" font-family="Inter, sans-serif" font-weight="900" font-size="30" fill="#38BDF8">K8s</text>
    <text x="85" y="130" text-anchor="middle" font-family="Inter, sans-serif" font-weight="600" font-size="16" fill="#94A3B8">Kubernetes</text>
  </g>

  <!-- Card 3: Autonomous AI -->
  <g transform="translate(500, 340)">
    <rect width="170" height="180" rx="20" fill="#1E293B" fill-opacity="0.8" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="85" y="75" text-anchor="middle" font-family="Inter, sans-serif" font-weight="900" font-size="24" fill="#34D399">Autonomous</text>
    <text x="85" y="105" text-anchor="middle" font-family="Inter, sans-serif" font-weight="900" font-size="24" fill="#34D399">AI Agents</text>
    <text x="85" y="145" text-anchor="middle" font-family="Inter, sans-serif" font-weight="600" font-size="15" fill="#94A3B8">Multi-Agent</text>
  </g>

  <!-- Card 4: LangGraph & RAG -->
  <g transform="translate(700, 340)">
    <rect width="170" height="180" rx="20" fill="#1E293B" fill-opacity="0.8" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="85" y="75" text-anchor="middle" font-family="Inter, sans-serif" font-weight="900" font-size="24" fill="#F472B6">LangGraph</text>
    <text x="85" y="105" text-anchor="middle" font-family="Inter, sans-serif" font-weight="900" font-size="24" fill="#F472B6">&amp; RAG</text>
    <text x="85" y="145" text-anchor="middle" font-family="Inter, sans-serif" font-weight="600" font-size="15" fill="#94A3B8">Orchestration</text>
  </g>

  <!-- Card 5: DevSecOps -->
  <g transform="translate(900, 340)">
    <rect width="170" height="180" rx="20" fill="#1E293B" fill-opacity="0.8" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="85" y="85" text-anchor="middle" font-family="Inter, sans-serif" font-weight="900" font-size="26" fill="#F59E0B">DevSecOps</text>
    <text x="85" y="130" text-anchor="middle" font-family="Inter, sans-serif" font-weight="600" font-size="16" fill="#94A3B8">Security &amp; CI/CD</text>
  </g>

  <!-- Footer domain watermark -->
  <text x="600" y="585" text-anchor="middle" font-family="Inter, sans-serif" font-weight="600" font-size="16" fill="#64748B" letter-spacing="1">pravinmathew-pearl.vercel.app</text>
</svg>
